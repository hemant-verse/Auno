<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .card {
      max-width: 540px;
      width: 100%;
      margin: 16px;
      padding: 32px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2.25rem;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 24px;
      color: #94a3b8;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      padding: 12px 22px;
      border-radius: 9999px;
      background: #14b8a6;
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Reload later when your connection returns</p>
    <a href="/">Reload</a>
  </div>
</body>

</html>
